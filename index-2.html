<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodeku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root {
    --ink: #111; --cream: #fffbf0; --white: #fff; --green: #6cffb0;
    --yellow: #ffe94d; --blue: #3b5bff; --red: #ff5c7a; --muted: #666; --code: #1c1c1e;
  }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 500; padding-bottom: 90px;
  }
  .hidden { display: none !important; }
  input, textarea, button, select { font: inherit; color: inherit; }
  input, textarea {
    width: 100%; background: var(--white); border: 3px solid var(--ink);
    border-radius: 14px; padding: 11px 14px; margin-bottom: 12px; outline: none;
  }
  input:focus, textarea:focus { box-shadow: 4px 4px 0 var(--ink); }
  textarea { font-family: "JetBrains Mono", monospace; font-size: .85rem; min-height: 170px; resize: vertical; }
  .btn {
    border: 3px solid var(--ink); border-radius: 14px; padding: 10px 16px; background: var(--white);
    font-weight: 800; cursor: pointer; box-shadow: 4px 4px 0 var(--ink); transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.green { background: var(--green); } .btn.yellow { background: var(--yellow); }
  .btn.blue { background: var(--blue); color: #fff; } .btn.red { background: var(--red); }
  .btn.sm { padding: 6px 12px; font-size: .8rem; box-shadow: 3px 3px 0 var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 100px; }

  .top {
    position: sticky; top: 0; z-index: 20; background: var(--white);
    border-bottom: 3px solid var(--ink); padding: 12px 14px; display: flex; gap: 10px; align-items: center;
  }
  .logo {
    background: var(--green); border: 3px solid var(--ink); border-radius: 12px;
    padding: 6px 12px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); white-space: nowrap; cursor: pointer;
  }
  .search { flex: 1; margin: 0; min-width: 0; }
  main { max-width: 760px; margin: 0 auto; padding: 18px 14px; }
  h1.title { font-size: 1.7rem; font-weight: 800; margin: 6px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; }
  .chip {
    flex: none; border: 3px solid var(--ink); border-radius: 999px; padding: 5px 14px;
    background: var(--white); font-weight: 700; font-size: .85rem; cursor: pointer;
  }
  .chip.on { background: var(--yellow); box-shadow: 3px 3px 0 var(--ink); }

  .card {
    background: var(--white); border: 3px solid var(--ink); border-radius: 22px;
    padding: 18px; margin-bottom: 22px; box-shadow: 7px 7px 0 var(--ink);
  }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .badge { border: 3px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: .75rem; text-transform: uppercase; }
  .badge.g { background: var(--green); } .badge.b { background: var(--blue); color: #fff; }
  .card h3 { margin: 0 0 6px; font-size: 1.15rem; font-weight: 800; word-break: break-word; }
  .card p { margin: 0 0 12px; color: var(--muted); word-break: break-word; }
  .win { background: var(--code); border: 3px solid var(--ink); border-radius: 16px; overflow: hidden; margin-bottom: 12px; }
  .win-bar { display: flex; align-items: center; gap: 7px; padding: 10px 14px; background: #2a2a2d; border-bottom: 3px solid var(--ink); }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .fname { margin-left: 8px; color: #aaa; font-family: "JetBrains Mono", monospace; font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  pre.code { margin: 0; padding: 12px 0; color: #e8e8e8; font-family: "JetBrains Mono", monospace; font-size: .82rem; overflow: auto; counter-reset: ln; white-space: pre; }
  pre.code.prev { max-height: 128px; overflow: hidden; }
  pre.code.full { max-height: 62vh; }
  .line { display: block; padding: 0 14px 0 0; min-height: 1.5em; line-height: 1.5; }
  .line::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 3em; text-align: right; margin-right: 14px; color: #666; user-select: none; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .tag { background: #dfe6ff; border: 3px solid var(--ink); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: .8rem; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; margin: 12px 0; padding-bottom: 6px; }
  .tabs .btn { flex: none; } .tabs .btn.on { background: var(--yellow); }
  .empty { text-align: center; color: var(--muted); padding: 50px 0; font-weight: 700; }

  nav.bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--white);
    border-top: 3px solid var(--ink); display: flex; justify-content: space-around; padding: 8px 4px 10px;
  }
  nav.bottom button { background: none; border: 0; font-weight: 800; font-size: .72rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 12px; }
  nav.bottom .ic { font-size: 1.3rem; }
  nav.bottom button.on .ic { background: var(--yellow); border: 3px solid var(--ink); border-radius: 50%; width: 44px; height: 44px; display: grid; place-items: center; margin-top: -22px; box-shadow: 3px 3px 0 var(--ink); }

  .login-card { width: 100%; max-width: 380px; margin: 40px auto; background: var(--white); border: 3px solid var(--ink); border-radius: 22px; padding: 24px; box-shadow: 8px 8px 0 var(--ink); }
  .login-card h2 { margin: 0 0 16px; font-size: 1.5rem; font-weight: 800; }
  .err { color: #c0102f; font-weight: 700; min-height: 1.3em; margin-bottom: 8px; font-size: .9rem; }
  .file-block { border: 3px solid var(--ink); border-radius: 16px; padding: 12px; margin-bottom: 14px; background: var(--cream); }
  .file-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .file-head input { margin: 0; }
  .upload { display: inline-block; text-align: center; }
  .upload input { display: none; }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 800; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }
  @media (min-width: 800px) { nav.bottom { display: none; } body { padding-bottom: 30px; } }
</style>
</head>
<body>

<div class="top">
  <div class="logo" id="logo">&lt;/&gt; Kodeku</div>
  <input class="search" id="search" type="search" placeholder="Cari snippet...">
  <button class="btn sm hidden" id="btnAccount" data-admin>Akun</button>
  <button class="btn sm" id="btnAuthTop">Admin</button>
</div>

<main>
  <!-- DAFTAR (publik) -->
  <section id="listView">
    <h1 class="title">&lt;/&gt; Snippet Terbaru</h1>
    <p class="sub" id="count"></p>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <!-- DETAIL (publik) -->
  <section id="detailView" class="hidden"></section>

  <!-- LOGIN ADMIN -->
  <section id="loginView" class="hidden">
    <form class="login-card" id="loginForm">
      <h2>Masuk Admin</h2>
      <input type="email" id="email" placeholder="Email" autocomplete="username" required>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <div class="row">
        <button class="btn green" type="submit">Masuk</button>
        <button class="btn" type="button" id="btnLoginCancel">Batal</button>
      </div>
    </form>
  </section>

  <!-- FORM (admin) -->
  <section id="formView" class="hidden">
    <h1 class="title" id="formTitle">Snippet Baru</h1>
    <input id="fTitle" placeholder="Judul (mis. Bot WhatsApp)">
    <input id="fDesc" placeholder="Deskripsi singkat (opsional)">
    <input id="fTags" placeholder="Tag, pisah koma (mis. bot, whatsapp)">
    <div class="row" style="margin-bottom:14px">
      <label class="btn blue upload">Upload file<input type="file" id="fUpload" multiple></label>
      <label class="btn blue upload">Upload folder<input type="file" id="fFolder" webkitdirectory multiple></label>
      <label class="btn blue upload">Upload ZIP<input type="file" id="fZip" accept=".zip,application/zip"></label>
      <button class="btn yellow" id="btnAddFile" type="button">+ File kosong</button>
    </div>
    <div id="fileEditors"></div>
    <div class="row">
      <button class="btn green" id="btnSave" type="button">Simpan</button>
      <button class="btn" id="btnCancel" type="button">Batal</button>
    </div>
  </section>

  <!-- AKUN (admin) -->
  <section id="accountView" class="hidden">
    <h1 class="title">Akun</h1>
    <p class="sub" id="accEmail"></p>
    <div class="card">
      <h3>Ganti email</h3>
      <input type="email" id="newEmail" placeholder="Email baru" autocomplete="off">
      <button class="btn yellow" id="btnSaveEmail" type="button">Simpan email</button>
      <p style="margin:12px 0 0">Link konfirmasi dikirim ke email baru. Email baru berlaku setelah link dibuka.</p>
    </div>
    <div class="card">
      <h3>Ganti password</h3>
      <input type="password" id="newPass" placeholder="Password baru (min. 8 karakter)" autocomplete="new-password">
      <input type="password" id="newPass2" placeholder="Ulangi password baru" autocomplete="new-password">
      <button class="btn green" id="btnSavePass" type="button">Simpan password</button>
    </div>
    <button class="btn" id="btnAccBack" type="button">← Kembali</button>
  </section>
</main>

<nav class="bottom">
  <button id="navHome" class="on"><span class="ic">⌂</span>Home</button>
  <button id="navSearch"><span class="ic">⌕</span>Cari</button>
  <button id="navNew" class="hidden" data-admin><span class="ic">＋</span>Baru</button>
  <button id="navAuth"><span class="ic">⏻</span><span id="navAuthLabel">Admin</span></button>
</nav>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = "https://scijnzxvzutszfgfpvvf.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_XDAGxAC1AU6tcf2AmZ3fXw_uKq7V-zw";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const LANG = {
    js:"javascript", mjs:"javascript", cjs:"javascript", ts:"typescript", py:"python",
    html:"html", css:"css", json:"json", md:"markdown", sh:"bash", sql:"sql", php:"php",
    java:"java", go:"go", rs:"rust", txt:"text", yml:"yaml", yaml:"yaml", xml:"xml"
  };
  let isAdmin = false, snippets = [], langFilter = "", editingId = null, draft = [];
  let currentId = null, activeIdx = 0;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const langOf = (n) => { const e = (n.split(".").pop() || "").toLowerCase(); return LANG[e] || e || "text"; };
  function toast(m) {
    const t = $("toast"); t.textContent = m; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1500);
  }
  async function copy(text, msg) {
    try { await navigator.clipboard.writeText(text); toast(msg || "Tersalin!"); }
    catch { toast("Gagal menyalin"); }
  }
  const VIEWS = ["listView","detailView","loginView","formView","accountView"];
  function show(view) {
    VIEWS.forEach(v => $(v).classList.toggle("hidden", v !== view));
    $("navHome").classList.toggle("on", view === "listView");
    $("navNew").classList.toggle("on", view === "formView");
    window.scrollTo(0, 0);
  }
  const codeHtml = (code, cls) =>
    `<pre class="code ${cls}">${code.split("\n").map(l => `<span class="line">${esc(l)}</span>`).join("")}</pre>`;

  /* ---------- Bagikan ---------- */
  const snippetUrl = (id) => location.origin + location.pathname + "?s=" + encodeURIComponent(id);
  async function shareSnippet(s) {
    const url = snippetUrl(s.id);
    if (navigator.share) {
      try { await navigator.share({ title: s.title, url }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    copy(url, "Link tersalin!");
  }

  /* ---------- Auth (admin) ---------- */
  function applyAuthUI() {
    document.querySelectorAll("[data-admin]").forEach(el => el.classList.toggle("hidden", !isAdmin));
    const label = isAdmin ? "Keluar" : "Admin";
    $("btnAuthTop").textContent = label;
    $("navAuthLabel").textContent = label;
  }
  async function boot() {
    const { data } = await sb.auth.getSession();
    isAdmin = !!data.session; applyAuthUI();
    sb.auth.onAuthStateChange((_e, session) => {
      const now = !!session;
      if (now === isAdmin) return;
      isAdmin = now; applyAuthUI(); renderList();
      if (!$("detailView").classList.contains("hidden") && currentId) openDetail(currentId, activeIdx);
    });
    await loadSnippets();
    const id = new URLSearchParams(location.search).get("s");
    if (id && snippets.some(s => s.id === id)) openDetail(id); else show("listView");
  }
  function authAction() {
    if (isAdmin) logout(); else { $("loginErr").textContent = ""; show("loginView"); $("email").focus(); }
  }
  async function logout() {
    await sb.auth.signOut();
    isAdmin = false; applyAuthUI(); renderList(); show("listView"); toast("Keluar");
  }
  $("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    $("loginErr").textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    if (error) { $("loginErr").textContent = "Email atau password salah"; $("password").value = ""; return; }
    isAdmin = true; applyAuthUI(); $("password").value = "";
    renderList(); show("listView"); toast("Masuk sebagai admin");
  };
  $("btnLoginCancel").onclick = () => show("listView");

  /* ---------- Data ---------- */
  async function loadSnippets() {
    const { data, error } = await sb.from("snippets").select("*").order("updated_at", { ascending: false });
    if (error) { toast("Gagal memuat data"); return; }
    snippets = data || [];
    if (langFilter && !snippets.some(s => s.files.some(f => f.lang === langFilter))) langFilter = "";
    renderChips(); renderList();
  }

  function renderChips() {
    const langs = [...new Set(snippets.flatMap(s => s.files.map(f => f.lang)).filter(Boolean))].sort();
    $("chips").innerHTML = ["", ...langs].map(l =>
      `<button class="chip ${l === langFilter ? "on" : ""}" data-l="${esc(l)}">${l ? esc(l) : "Semua"}</button>`).join("");
    document.querySelectorAll(".chip").forEach(c => c.onclick = () => { langFilter = c.dataset.l; renderChips(); renderList(); });
  }

  function renderList() {
    const q = $("search").value.trim().toLowerCase();
    const items = snippets.filter(s =>
      (!langFilter || s.files.some(f => f.lang === langFilter)) &&
      (!q || s.title.toLowerCase().includes(q) || (s.description || "").toLowerCase().includes(q) ||
        s.tags.some(t => t.toLowerCase().includes(q)) ||
        s.files.some(f => f.name.toLowerCase().includes(q) || f.code.toLowerCase().includes(q))));
    $("count").textContent = `Menampilkan ${items.length} dari ${snippets.length} snippet.`;
    if (!items.length) { $("list").innerHTML = '<div class="empty">Belum ada snippet.</div>'; return; }
    $("list").innerHTML = items.map(s => {
      const f = s.files[0] || { name: "-", code: "", lang: "" };
      const prev = f.code.split("\n").slice(0, 5).join("\n");
      return `<article class="card">
        <div class="badges">
          <span class="badge g">${esc(f.lang || "text")}</span>
          <span class="badge b">${s.files.length} file</span>
        </div>
        <h3>${esc(s.title)}</h3>
        ${s.description ? `<p>${esc(s.description)}</p>` : ""}
        <div class="win">
          <div class="win-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="fname">${esc(f.name)}</span></div>
          ${codeHtml(prev, "prev")}
        </div>
        <div class="tags">${s.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("")}</div>
        <div class="row">
          <button class="btn yellow" data-open="${s.id}">Lihat</button>
          <button class="btn green" data-copy="${s.id}">Salin</button>
          <button class="btn blue" data-share="${s.id}">Bagikan</button>
        </div>
      </article>`;
    }).join("");
    document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openDetail(b.dataset.open));
    document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () =>
      copy(snippets.find(s => s.id === b.dataset.copy).files[0].code));
    document.querySelectorAll("[data-share]").forEach(b => b.onclick = () =>
      shareSnippet(snippets.find(s => s.id === b.dataset.share)));
  }

  function openDetail(id, idx = 0) {
    const s = snippets.find(x => x.id === id); if (!s) return;
    currentId = id; activeIdx = Math.min(idx, s.files.length - 1);
    const f = s.files[activeIdx];
    $("detailView").innerHTML = `
      <button class="btn sm" id="back">← Kembali</button>
      <h1 class="title" style="margin-top:14px">${esc(s.title)}</h1>
      ${s.description ? `<p class="sub">${esc(s.description)}</p>` : ""}
      <div class="tags">${s.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("")}</div>
      ${s.files.length > 1 ? `<div class="tabs">${s.files.map((x, i) =>
        `<button class="btn sm ${i === activeIdx ? "on" : ""}" data-tab="${i}">${esc(x.name)}</button>`).join("")}</div>` : ""}
      <div class="win">
        <div class="win-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="fname">${esc(f.name)}</span></div>
        ${codeHtml(f.code, "full")}
      </div>
      <div class="row">
        <button class="btn green" id="cp1">Salin file ini</button>
        ${s.files.length > 1 ? '<button class="btn yellow" id="cpAll">Salin semua</button>' : ""}
        <button class="btn blue" id="shr">Bagikan</button>
        ${isAdmin ? '<button class="btn" id="ed">Edit</button><button class="btn red" id="del">Hapus</button>' : ""}
      </div>`;
    $("back").onclick = () => { history.replaceState(null, "", location.pathname); show("listView"); };
    $("cp1").onclick = () => copy(f.code);
    if ($("cpAll")) $("cpAll").onclick = () => copy(s.files.map(x => `// ===== ${x.name} =====\n${x.code}`).join("\n\n"));
    $("shr").onclick = () => shareSnippet(s);
    if (isAdmin) { $("ed").onclick = () => openForm(s); $("del").onclick = () => removeSnippet(s.id); }
    document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => openDetail(id, +b.dataset.tab));
    history.replaceState(null, "", "?s=" + encodeURIComponent(id));
    show("detailView");
  }

  /* ---------- Form (admin) ---------- */
  function openForm(s = null) {
    if (!isAdmin) return toast("Hanya admin yang bisa mengubah");
    editingId = s ? s.id : null;
    draft = s ? s.files.map(f => ({ ...f })) : [{ name: "index.js", lang: "javascript", code: "" }];
    $("formTitle").textContent = s ? "Edit Snippet" : "Snippet Baru";
    $("fTitle").value = s ? s.title : "";
    $("fDesc").value = s ? s.description : "";
    $("fTags").value = s ? s.tags.join(", ") : "";
    renderEditors(); show("formView");
  }
  function syncDraft() {
    const blocks = document.querySelectorAll(".file-block"); if (!blocks.length) return;
    draft = [...blocks].map(b => {
      const name = b.querySelector(".fn").value.trim();
      return { name, lang: langOf(name), code: b.querySelector(".fc").value };
    });
  }
  function renderEditors() {
    $("fileEditors").innerHTML = draft.map((f, i) => `
      <div class="file-block">
        <div class="file-head">
          <input class="fn" value="${esc(f.name)}" placeholder="nama-file.ext">
          <button class="btn sm red" data-rm="${i}" type="button">Hapus</button>
        </div>
        <textarea class="fc" placeholder="Isi kode...">${esc(f.code)}</textarea>
      </div>`).join("");
    document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
      syncDraft();
      if (draft.length === 1) return toast("Minimal satu file");
      draft.splice(+b.dataset.rm, 1); renderEditors();
    });
  }
  $("btnAddFile").onclick = () => { syncDraft(); draft.push({ name: "file-baru.txt", lang: "text", code: "" }); renderEditors(); };
  $("fUpload").onchange = async (e) => {
    syncDraft();
    for (const file of e.target.files) draft.push({ name: file.name, lang: langOf(file.name), code: await file.text() });
    draft = draft.filter((f, i) => !(i === 0 && f.name === "index.js" && !f.code.trim()));
    if (!draft.length) draft = [{ name: "index.js", lang: "javascript", code: "" }];
    e.target.value = ""; renderEditors(); toast("File ditambahkan");
  };

  /* ---------- Upload folder / ZIP ---------- */
  const SKIP_PATH = /(^|\/)(node_modules|\.git|\.next|dist|build|__pycache__|__MACOSX|\.idea|\.vscode)(\/|$)|(^|\/)(\.DS_Store|package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$/i;
  const SKIP_EXT = /\.(png|jpe?g|gif|webp|ico|bmp|svg|mp3|mp4|mov|avi|wav|zip|rar|7z|gz|tar|pdf|woff2?|ttf|otf|eot|exe|dll|so|bin|db|sqlite)$/i;
  const MAX_FILES = 150, MAX_BYTES = 400 * 1024;

  function addFilesToDraft(items, skipped, titleHint) {
    syncDraft();
    for (const it of items) draft.push({ name: it.name, lang: langOf(it.name), code: it.text });
    draft = draft.filter((f, i) => !(i === 0 && f.name === "index.js" && !f.code.trim()));
    if (!draft.length) draft = [{ name: "index.js", lang: "javascript", code: "" }];
    if (titleHint && !$("fTitle").value.trim()) $("fTitle").value = titleHint;
    renderEditors();
    toast(items.length + " file ditambahkan" + (skipped ? ", " + skipped + " dilewati" : ""));
  }
  $("fFolder").onchange = async (e) => {
    const files = [...e.target.files];
    const items = []; let skipped = 0;
    const root = files[0] && files[0].webkitRelativePath ? files[0].webkitRelativePath.split("/")[0] : "";
    for (const f of files) {
      const rel = f.webkitRelativePath ? f.webkitRelativePath.split("/").slice(1).join("/") : f.name;
      if (!rel || SKIP_PATH.test(rel) || SKIP_EXT.test(rel) || f.size > MAX_BYTES || items.length >= MAX_FILES) { skipped++; continue; }
      const text = await f.text();
      if (text.includes("\u0000") || !text.trim()) { skipped++; continue; }
      items.push({ name: rel, text });
    }
    e.target.value = "";
    if (!items.length) return toast("Tidak ada file teks yang bisa dibaca");
    addFilesToDraft(items, skipped, root);
  };
  $("fZip").onchange = async (e) => {
    const file = e.target.files[0]; e.target.value = "";
    if (!file) return;
    if (typeof JSZip === "undefined") return toast("Library ZIP gagal dimuat");
    try {
      const zip = await JSZip.loadAsync(file);
      const entries = Object.values(zip.files).filter(z => !z.dir);
      const first = entries[0] ? entries[0].name.split("/")[0] : "";
      const strip = first && entries.every(z => z.name.startsWith(first + "/"));
      const items = []; let skipped = 0;
      for (const z of entries) {
        const rel = strip ? z.name.slice(first.length + 1) : z.name;
        if (!rel || SKIP_PATH.test(rel) || SKIP_EXT.test(rel) || items.length >= MAX_FILES) { skipped++; continue; }
        const text = await z.async("string");
        if (text.length > MAX_BYTES || text.includes("\u0000") || !text.trim()) { skipped++; continue; }
        items.push({ name: rel, text });
      }
      if (!items.length) return toast("Tidak ada file teks yang bisa dibaca");
      addFilesToDraft(items, skipped, file.name.replace(/\.zip$/i, ""));
    } catch { toast("ZIP tidak bisa dibaca"); }
  };

  $("btnSave").onclick = async () => {
    if (!isAdmin) return toast("Hanya admin yang bisa mengubah");
    syncDraft();
    const title = $("fTitle").value.trim();
    const files = draft.filter(f => f.name && f.code.trim());
    if (!title) return toast("Judul wajib diisi");
    if (!files.length) return toast("Minimal satu file dengan isi");
    const payload = {
      title, description: $("fDesc").value.trim(),
      tags: $("fTags").value.split(",").map(t => t.trim()).filter(Boolean),
      files, updated_at: new Date().toISOString()
    };
    const res = editingId
      ? await sb.from("snippets").update(payload).eq("id", editingId).select().single()
      : await sb.from("snippets").insert(payload).select().single();
    if (res.error) return toast("Gagal menyimpan (cek login admin)");
    await loadSnippets(); toast("Tersimpan"); openDetail(res.data.id);
  };
  $("btnCancel").onclick = () => show("listView");

  async function removeSnippet(id) {
    if (!isAdmin) return;
    if (!confirm("Hapus snippet ini beserta semua filenya?")) return;
    const { error } = await sb.from("snippets").delete().eq("id", id);
    if (error) return toast("Gagal menghapus");
    history.replaceState(null, "", location.pathname);
    await loadSnippets(); show("listView"); toast("Dihapus");
  }

  /* ---------- Akun (admin) ---------- */
  async function openAccount() {
    if (!isAdmin) return;
    const { data } = await sb.auth.getUser();
    $("accEmail").textContent = data && data.user ? "Masuk sebagai " + data.user.email : "";
    $("newEmail").value = ""; $("newPass").value = ""; $("newPass2").value = "";
    show("accountView");
  }
  $("btnSaveEmail").onclick = async () => {
    const email = $("newEmail").value.trim();
    if (!email) return toast("Isi email baru");
    const { error } = await sb.auth.updateUser({ email });
    if (error) return toast("Gagal: " + error.message);
    toast("Cek email baru untuk konfirmasi");
  };
  $("btnSavePass").onclick = async () => {
    const p = $("newPass").value;
    if (p.length < 8) return toast("Password minimal 8 karakter");
    if (p !== $("newPass2").value) return toast("Password tidak sama");
    const { error } = await sb.auth.updateUser({ password: p });
    if (error) return toast("Gagal: " + error.message);
    $("newPass").value = ""; $("newPass2").value = "";
    toast("Password diganti");
  };
  $("btnAccount").onclick = openAccount;
  $("btnAccBack").onclick = () => show("listView");

  /* ---------- Nav ---------- */
  function goList() { history.replaceState(null, "", location.pathname); show("listView"); }
  $("search").oninput = () => { if ($("listView").classList.contains("hidden")) goList(); renderList(); };
  $("logo").onclick = goList;
  $("navHome").onclick = goList;
  $("navSearch").onclick = () => { goList(); $("search").focus(); };
  $("navNew").onclick = () => openForm();
  $("navAuth").onclick = authAction;
  $("btnAuthTop").onclick = authAction;

  boot();
</script>
</body>
</html>
